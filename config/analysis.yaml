# Downstream conditions for a completed database; outputs: results/<build>/downstream/<name>/.
build: results/angiosperm_leaf_20260928  # Completed build directory or database/ bundle.
inputs:
  species_trait: input/species_trait.tsv  # Species traits (TSV); null when traits are unused.
  species_list: null  # Species/sample IDs, one per line; a path enables filtering, null disables it.
  calibrations: null  # Calibration TSV required when phylogeny.dating.calibration_source is file.
trait: carnivory  # Trait-table column; use C4 when a C4 column is provided.
selection:
  busco_threshold: 0.5  # Minimum complete BUSCO fraction (single + duplicated); 0.5 = 50%.
alignment:
  enabled: false  # Include all-copy orthogroup alignments in the all target.
kegg:
  enabled: false  # Include KO annotation and expression in the all target.
  ambiguity: duplicate  # Multi-KO orthogroups: duplicate TPM to each KO, drop the OG, or error.
phylogeny:
  trees:  # Any of all, phenotyped, representatives; [] disables tree inference.
  - representatives
  outgroup: auto  # Infer a basal group from taxonomy, or supply species/sample ID(s).
  max_markers: 500  # Maximum BUSCO markers, ranked by species coverage.
  min_protein_length: 100  # Minimum known amino acids per extracted/trimmed sequence.
  max_unknown_fraction: 0.05  # Maximum unknown amino-acid fraction in prepared proteins.
  min_taxa: 4  # Minimum distinct biological species per marker; must be at least 4.
  trimal_mode: gappyout  # Alignment trimming: gappyout or automated1.
  dating:
    enabled: false  # Date selected trees; supports all/phenotyped only.
    calibration_source: timetree  # Age bounds from timetree or file (inputs.calibrations).
  contrast_pairs:
    enabled: true  # Select trait contrast pairs on the chosen trees.
  taxonomy_check:
    enabled: false  # Review taxonomic monophyly; supports all/phenotyped only.
    ranks:  # NCBI taxonomic ranks assessed independently.
    - family
    - subfamily
    - tribe
    - subtribe
    - genus
    outlierlevel: 0.5  # Required focal-group fraction in a candidate core clade; (0, 1].
    collapse_monophyletic: true  # Collapse monophyletic groups in figures only.
exclude_species: []  # Species IDs (all samples) or exact sample IDs to omit before analysis.
slurm:
  partition: null  # null: cluster default; multiple: "epyc,rome,medium".
  total_limits:  # Per analysis; CPU/memory include the controller allocation.
    jobs: null  # No workflow job-count cap; Slurm and finite CPU/memory budgets still apply.
    cpus: null  # Total CPU request budget; null adds no workflow-wide limit.
    mem_gb: null  # Total memory request budget in GB; null adds no workflow-wide limit.
  per_job_resources:  # Per-job cpus, mem_gb (GB), and time (days-HH:MM:SS).
    controller:  # Runs Snakemake and manages its worker jobs.
      cpus: 1
      mem_gb: 8
      time: "64-00:00:00"
    import_build_protein:  # Import proteins and provenance from the completed database.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    import_build_expression:  # Import saved per-sample OG expression.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    align_orthogroup:  # Align each all-copy orthogroup.
      cpus: 4
      mem_gb: 8
      time: "1-00:00:00"
    annotate_kofam:  # Annotate batches of median-length OG representatives.
      cpus: 4
      mem_gb: 8
      time: "1-00:00:00"
    select_contrast_representatives:  # Select trait-based representatives.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    align_busco_marker:  # Align each BUSCO marker.
      cpus: 4
      mem_gb: 8
      time: "1-00:00:00"
    trim_busco_marker:  # Trim each BUSCO marker alignment.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    infer_busco_gene_tree:  # Infer each BUSCO gene tree with VeryFastTree.
      cpus: 4
      mem_gb: 8
      time: "1-00:00:00"
    infer_busco_species_tree:  # Infer the species tree with ASTRAL.
      cpus: 32
      mem_gb: 64
      time: "14-00:00:00"
    prepare_timetree_calibrations:  # Retrieve TimeTree age constraints.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    date_busco_species_tree:  # Date the species tree with LSD2.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    identify_contrast_pairs:  # Select pairs on the representative tree.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    identify_phylogeny_contrast_pairs:  # Select pairs on all/phenotyped trees.
      cpus: 1
      mem_gb: 4
      time: "1-00:00:00"
    check_taxonomy:  # Review taxonomic monophyly.
      cpus: 1
      mem_gb: 8
      time: "1-00:00:00"
    filter_species:  # Export a species subset from completed results.
      cpus: 1
      mem_gb: 8
      time: "1-00:00:00"
