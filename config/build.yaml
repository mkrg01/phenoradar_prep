# Reusable sample database under results/<build_name>/.
# Paths are relative to the project root.
name: angiosperm_leaf  # Dataset prefix; no manual date suffix needed.
name_mode: timestamp  # New builds append UTC preparation time; --name sets an exact name.
metadata: input/metadata.tsv  # Input sample/run table (TSV).
excluded_accessions: config/excluded_accessions.tsv  # Manual run exclusions; null disables.
reuse_from: results/angiosperm_leaf_20260928/database  # Build/database path or list, auto for prior sample stages, null for a fresh build.
rebuild_samples: []  # Sample IDs or run accessions to process from scratch in this new build.
translation:
  table: 1  # NCBI genetic code for CDS translation; 1 = standard.
busco:
  lineage: embryophyta_odb12  # BUSCO lineage dataset for completeness and marker extraction.
  cache_dir: resources/busco  # Shared, immutable lineage downloads; null uses GeneGalleon's per-sample cache.
taxonomy:
  cache_dir: resources/taxonomy  # Shared ETE/NCBI database; null uses per-sample downloads.
odb:
  version: v12  # Reuse mapping when both this release and ncbi_tax_id match.
  chunk_size: 50  # Maximum samples per ODB mapping chunk.
  ncbi_tax_id: 3193  # OrthoDB mapping clade: Embryophyta (land plants); NCBI Taxonomy ID.
genegalleon:
  version: 0.8.276  # Latest source on 2026-10-16; update explicitly.
  revision: 7f2fa68585deb9d470ea1a1146671d2d2d7b8c53  # Pinned source commit.
  image_uri: docker://ghcr.io/kfuku52/genegalleon@sha256:0342363342b56ab56161acf91774bf2243ffd76c9bdfca1fa7fb3df36ba440a4  # Container pinned by OCI digest.
  settings:
    assembly_method: rnaSPAdes  # Transcriptome assembler passed to GeneGalleon.
slurm:
  partition: null  # null: cluster default; multiple: "epyc,rome,medium".
  total_limits:  # Per build; CPU/memory include the controller allocation.
    jobs: null  # No workflow job-count cap; Slurm and finite CPU/memory budgets still apply.
    cpus: null  # Total CPU request budget; null adds no workflow-wide limit.
    mem_gb: null  # Total memory request budget in GB; null adds no workflow-wide limit.
  per_job_resources:  # Per-job requests; cpus = CPU count, mem_gb = GB, time = days-HH:MM:SS.
    sample:  # One GeneGalleon job runs assembly, BUSCO, quant, and merge.
      cpus: 4
      mem_gb: 128
      time: "16-00:00:00"
    odb_map:
      cpus: 16
      mem_gb: 128
      time: "2-00:00:00"
    prepare_odb_reference:
      cpus: 1
      mem_gb: 32
      time: "1-00:00:00"
    controller:  # Verifies uncached products (up to 4 threads) and manages worker jobs.
      cpus: 4
      mem_gb: 8
      time: "64-00:00:00"
storage:
  keep_intermediates: false  # Remove scratch and completed sample work; true retains it for debugging.
