# Manual metadata is the source of inclusion decisions. See docs/datasets.md.
metadata: input/metadata.tsv
store: resources/dataset_assets
analysis_config: null  # Optional override, e.g. config/reuse_odb.local.yaml.
odb_chunk_size: 20

genegalleon:
  repository: null  # Absolute path to an existing GeneGalleon checkout.
  image: null       # Absolute SIF path; defaults to <repository>/genegalleon.sif.
  settings:
    assembly_method: rnaSPAdes
    amalgkit_rrna_filter: "yes"
    amalgkit_contam_filter: "no"

slurm:
  partition: epyc  # Adjust to your allocation/site.
  account: null
  concurrency: 5  # Maximum simultaneous species tasks; array batches run in sequence.
  array_size: 1000  # Maximum local task ID; must be smaller than Slurm MaxArraySize.
  downstream_jobs: 10
  downstream_profile: profiles/slurm
  stages:
    assembly: {cpus: 4, mem_mb: 128000, time: "3-00:00:00"}
    busco: {cpus: 4, mem_mb: 32000, time: "1-00:00:00"}
    quant: {cpus: 4, mem_mb: 32000, time: "1-00:00:00"}
    downstream: {cpus: 1, mem_mb: 8000, time: "3-00:00:00"}
