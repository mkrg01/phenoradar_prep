# Dataset, analysis, and resource settings. Commands are fixed in the workflow.
# Paths are relative to the project root (run Snakemake there).
analysis: full
inputs:
  metadata: metadata/metadata.tsv
  busco: transcriptome_assembly/multispecies_summary/busco_full_longest_cds.tsv
  cds_dir: transcriptome_assembly/longest_cds
  quant_dir: transcriptome_assembly/amalgkit_quant
selection:
  busco_threshold: 0.5
  species_list: null
  missing_taxonomy: error
taxonomy:
  # Created automatically when missing; existing snapshots are reused unchanged.
  database: resources/taxonomy/taxa.sqlite
  # Optional local SQLite source. null downloads NCBI taxonomy and builds with ETE4.
  source: null
paths:
  results: results
  work: work
  logs: logs
translation:
  table: 1
odb:
  # Optional local snapshot of existing annotations and original protein checksums.
  existing_results: null
  node: 3193
  reference_dir: resources/orthodb/v12_3193
  # Per chunk; concurrency follows the workflow's total CPU and memory budgets.
  chunk_size: 50
  threads: 16
  batch_size: 64
  mem_gb: 192
  min_free_gb: 750
  reference_min_free_gb: 200
  allow_nonlocal: false
  keep_work: false
tpm:
  # error: reject ambiguous genes; drop: omit them; split: divide TPM equally.
  multimap: error
kegg:
  # Opt in for the full workflow; the explicit `kegg` target also runs this branch.
  enabled: false
  # Prepare this immutable snapshot with workflow/scripts/prepare_kegg_reference.py.
  reference_dir: resources/kegg/snapshot_v1
  threads: 4
  mem_gb: 8
  # duplicate: add full TPM to every accepted KO; drop: omit multi-KO genes; error: reject them.
  ambiguity: duplicate
phylogeny:
  # The explicit phylogeny/timetree targets also work without enabling rule all.
  enabled: false
  busco_full_dir: null
  busco_full_suffix: .busco.full.tsv
  lineage: embryophyta_odb12
  # Original oriented, in-frame CDS, or original protein FASTA used by BUSCO.
  sequence_mode: cds
  sequence_dir: null  # null reuses selected samples' CDS paths (CDS mode only)
  sequence_suffix: _longestCDS.fa.gz
  outgroup: null  # required; exact selected species label
  max_markers: 500  # highest overall BUSCO coverage first; ties by BUSCO ID ascending
  min_protein_length: 100  # known amino acids, excluding X and gaps
  max_unknown_fraction: 0.05
  min_taxa: 4
  trimal_mode: gappyout  # gappyout | automated1 (the latter computes all sequence pairs)
  align_threads: 4
  tree_threads: 4
  astral_threads: 32
  preparation_mem_gb: 4
  alignment_mem_gb: 8
  trimming_mem_gb: 4
  tree_mem_gb: 8
  astral_mem_gb: 64
  seed: 12345
  dating:
    enabled: false
    calibration_source: file  # file | timetree
    calibrations: null  # TSV: taxa, min_age_ma, max_age_ma, source
    mem_gb: 4
    lsd2:
      variance: 1  # 0: unweighted; 1: input lengths; 2: reweight after initial fit
      variance_parameter: null  # null uses LSD2's automatic variance offset
      numsites: null  # default: sum of retained trimmed gene lengths; affects variance offset
    timetree:
      representatives: null  # optional exact tree labels, one per line
      max_representatives: 64
      max_queries: 32
      min_studies: 5
      cache_dir: resources/timetree_cache
      offline: false
