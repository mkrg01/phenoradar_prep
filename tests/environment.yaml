# Python test suite and Snakemake; real-tool smoke tests use the container.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - snakemake-executor-plugin-slurm
  - snakemake-executor-plugin-cluster-generic
  - snakemake-minimal=9.8.0
  - pytest=8.4.1
  - biopython=1.85
  - cdskit=0.27.0
  - ete4=4.4.0  # Required by nwkit in this shared test environment.
  - brotli-python
  - matplotlib-base=3.10.6
  - numpy
  - pandas=2.2.3
  - pyyaml
  - requests
  - pip
  - setuptools>=77.0.3
  - pip:
      - "nwkit @ https://codeload.github.com/kfuku52/nwkit/tar.gz/1ca72a8fd8618ef25e6a9d2eb1eb47f481385689#sha256=3bb042825662ceff63c391cd1849b397ab1b9fd2198bae294712dba95e505a04"
