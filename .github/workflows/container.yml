name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: 26.1.1-3
          activate-environment: phenoradar-workflow
          environment-file: environment.yaml
      - name: Check generated Dockerfile
        run: python workflow/scripts/generate_container.py --check
      - name: Test generation and configuration
        run: python -m pytest -q tests/test_container.py tests/test_configuration.py tests/test_run_pipeline.py

  image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: phenoradar_prep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check all environments and real tools without network access
        run: docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace phenoradar_prep:ci python tests/container_smoke.py
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "$GITHUB_REF_NAME" latest; do
            docker tag phenoradar_prep:ci "$image:$tag"
            docker push "$image:$tag"
          done
