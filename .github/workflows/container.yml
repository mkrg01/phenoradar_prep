name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  image:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: phenoradar_prep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check all environments and real tools without network access
        run: docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace phenoradar_prep:ci python tests/container_smoke.py
