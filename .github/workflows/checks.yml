name: Workflow checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: 26.1.1-3
          activate-environment: phenoradar-workflow
          environment-file: environment.yaml
      - name: Check generated Dockerfile
        run: python workflow/scripts/generate_container.py --check
      - name: Test configuration, launcher, container, and release automation
        run: python -m pytest -q tests/test_container.py tests/test_configuration.py tests/test_run_pipeline.py tests/test_release.py
