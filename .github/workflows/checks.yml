name: Workflow checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: 26.1.1-3
          activate-environment: phenoradar-workflow
          environment-file: tests/environment.yaml
      - name: Generate Dockerfile from source recipes
        run: python workflow/scripts/generate_container.py
      - name: Run Python test suite
        run: python -m pytest -q -ra tests
      - name: Save generated Dockerfile
        uses: actions/upload-artifact@v7
        with:
          name: container-recipe
          path: Dockerfile
          if-no-files-found: error
          overwrite: true
