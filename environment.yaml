# Host environment for workflow execution and container generation; tests use tests/environment.yaml.
# Workflow users may install Snakemake by any supported method.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - ete4=4.3.0  # Native output validation runs in the host environment.
  - snakemake-executor-plugin-slurm
  - snakemake-executor-plugin-cluster-generic
  - snakemake-minimal=9.8.0
  - pytest=8.4.1
