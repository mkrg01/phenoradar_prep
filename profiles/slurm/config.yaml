# Install snakemake-executor-plugin-slurm in the Snakemake environment.
# Controller resources are independent of these per-job worker resources.
# Native Snakemake units below; edit mem_gb and time in the phase configs.
# Generated profiles convert time strings to runtime in minutes for Snakemake.
executor: slurm
slurm-no-account: true  # Submit without an explicit Slurm account.
jobs: 10  # Maximum active Snakemake worker jobs.
latency-wait: 90  # Seconds to wait for output files on shared storage.
rerun-incomplete: true  # Retry outputs marked incomplete by Snakemake.
printshellcmds: true  # Log commands executed by workflow rules.
default-resources:  # Per-worker defaults; mem_mb = MB, runtime = minutes.
  mem_mb: 8000
  runtime: 1440
  slurm_partition: epyc  # Cluster partition; adjust for the local scheduler.
set-resources:  # Per-rule overrides; mem_mb = MB, runtime = minutes.
  odb_map:
    mem_mb: 192000
    runtime: 4320
  prepare_odb_reference:
    mem_mb: 32000
    runtime: 1440
